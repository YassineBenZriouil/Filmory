<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#0F1E26" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
        />
        <link rel="preconnect" href="https://image.tmdb.org" />
        <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@600;800&display=swap"
        />
        <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
        <title>Filmory</title>
        <script>
            // Set the theme before first paint so the page never flashes the wrong colours.
            (function () {
                var t = "system";
                try {
                    t = localStorage.getItem("theme") || "system";
                } catch (e) {}
                var dark =
                    t === "dark" ||
                    (t === "system" &&
                        window.matchMedia("(prefers-color-scheme: dark)")
                            .matches);
                document.documentElement.classList.toggle("dark", dark);
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
